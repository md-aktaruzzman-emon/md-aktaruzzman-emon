<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian / Indigo Background Palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050308" />
      <stop offset="45%" stop-color="#0b0614" />
      <stop offset="100%" stop-color="#030205" />
    </linearGradient>

    <!-- Multi-Layer Atmospheric Radial Glows -->
    <radialGradient id="glowRight" cx="78%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#8458B3" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#8458B3" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8458B3" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowLeft" cx="22%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#A0D2EB" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#A0D2EB" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#A0D2EB" stop-opacity="0" />
    </radialGradient>

    <!-- Vercel/Linear Multi-Stop Premium Text Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A0D2EB" />
      <stop offset="40%" stop-color="#D0BDF4" />
      <stop offset="100%" stop-color="#8458B3" />
    </linearGradient>

    <!-- Glassmorphic Border Linear Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0D2EB" stroke-opacity="0.6" />
      <stop offset="50%" stop-color="#8458B3" stroke-opacity="0.38" />
      <stop offset="100%" stop-color="#A28089" stroke-opacity="0.2" />
    </linearGradient>

    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0617" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#06030c" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#130a21" />
      <stop offset="100%" stop-color="#090411" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b0e30" />
      <stop offset="100%" stop-color="#08030e" />
    </linearGradient>

    <!-- Micro Technical Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5EAF5" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>

    <!-- Realistic Drop Shadows & Glow Filters -->
    <filter id="terminalShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.82" />
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#8458B3" flood-opacity="0.22" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="850" height="260" fill="url(#bgGrad)" rx="12" />
  <rect width="850" height="260" fill="url(#glowLeft)" rx="12" />
  <rect width="850" height="260" fill="url(#glowRight)" rx="12" />
  <rect width="850" height="260" fill="url(#grid)" rx="12" />

  <!-- Outer Glass Frame Inset Accent Ring -->
  <rect width="848" height="258" x="1" y="1" fill="none" stroke="url(#borderGrad)" stroke-opacity="0.28" stroke-width="1" rx="11" />

  <!-- TOP RIGHT & BOTTOM STATUS HUD OVERLAYS -->
  <g font-family="Consolas, Monaco, 'SF Mono', monospace" font-size="9" letter-spacing="1">
    <!-- Top Right System Status Indicator -->
    <g transform="translate(685, 20)">
      <rect width="135" height="18" rx="9" fill="#0c0615" fill-opacity="0.7" stroke="#A28089" stroke-opacity="0.25" stroke-width="0.8" />
      <circle cx="12" cy="9" r="3" fill="#27c93f" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="22" y="12" fill="#A0D2EB" font-weight="bold">STATUS: ONLINE</text>
    </g>

    <!-- Bottom Left Subtle Stack Tag -->
    <text x="32" y="248" fill="#A28089" fill-opacity="0.6">STACK: [ C | C++ | JAVA | PYTHON | SQL ]</text>
  </g>

  <!-- LEFT SECTION: Modern Glassmorphic Terminal Window -->
  <g transform="translate(32, 24)" filter="url(#terminalShadow)">
    <!-- Terminal Glass Container -->
    <rect width="474" height="208" fill="url(#terminalBg)" rx="9" stroke="url(#borderGrad)" stroke-width="1.2" />
    
    <!-- Titlebar Header -->
    <path d="M 0 9 A 9 9 0 0 1 9 0 L 465 0 A 9 9 0 0 1 474 9 L 474 34 L 0 34 Z" fill="url(#headerBg)" />
    <line x1="0" y1="34" x2="474" y2="34" stroke="#A28089" stroke-width="1" stroke-opacity="0.18" />
    
    <!-- Window Control Buttons (Apple Polished Dots with subtle inset border) -->
    <circle cx="18" cy="17" r="5" fill="#ff5f56" />
    <circle cx="18" cy="17" r="4.5" fill="none" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="34" cy="17" r="5" fill="#ffbd2e" />
    <circle cx="34" cy="17" r="4.5" fill="none" stroke="#dea123" stroke-width="0.5" />
    <circle cx="50" cy="17" r="5" fill="#27c93f" />
    <circle cx="50" cy="17" r="4.5" fill="none" stroke="#1aab29" stroke-width="0.5" />
    
    <!-- Terminal Tab Badge & Title -->
    <g transform="translate(198, 8)">
      <rect width="112" height="18" rx="4" fill="#060309" fill-opacity="0.65" stroke="#A28089" stroke-opacity="0.2" stroke-width="0.8" />
      <text x="56" y="13" font-family="Consolas, Monaco, 'SF Mono', 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#A28089" fill-opacity="0.9" text-anchor="middle" letter-spacing="0.6">bash • profile.sh</text>
    </g>

    <!-- Terminal Content Area -->
    <g transform="translate(24, 62)">
      <!-- Command Execution Line -->
      <text x="0" y="0" font-family="Consolas, Monaco, 'SF Mono', 'Courier New', monospace" font-size="12.5" fill="#A0D2EB" font-weight="bold">
        guest@emon-desktop:~$ <tspan fill="#E5EAF5" font-weight="normal">whoami</tspan>
      </text>
      
      <!-- Primary Developer Name -->
      <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="url(#accentGrad)" letter-spacing="0.5">
        Md. Aktaruzzman Emon
      </text>
      
      <!-- Subtitle Engineering Focus -->
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#D0BDF4" fill-opacity="0.95" letter-spacing="0.4">
        CSE Undergraduate | Systems | Defensive Security
      </text>

      <!-- Bullet Info Code Blocks -->
      <g transform="translate(0, 88)" font-family="Consolas, Monaco, 'SF Mono', 'Courier New', monospace" font-size="12">
        <text x="0" y="0" fill="#E5EAF5">
          <tspan fill="#A0D2EB" font-weight="bold">❯</tspan> <tspan fill="#A28089">systems::</tspan><tspan fill="#E5EAF5">C_C++_development</tspan>
        </text>
        <text x="0" y="20" fill="#E5EAF5">
          <tspan fill="#A0D2EB" font-weight="bold">❯</tspan> <tspan fill="#8458B3" font-weight="bold">security::</tspan><tspan fill="#E5EAF5">packet_analysis_labs</tspan>
        </text>
        
        <!-- Smooth Blinking Terminal Cursor -->
        <rect x="254" y="9" width="8" height="13" fill="#A0D2EB" opacity="0.85">
          <animate attributeName="opacity" values="0.85;0.05;0.85" dur="1.1s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
  </g>

  <!-- RIGHT SECTION: World-Class Cybersecurity, Systems & AI HUD Visualization -->
  <g transform="translate(658, 130)">
    <!-- Ambient Radial Pulse Background Circle -->
    <circle cx="0" cy="0" r="105" fill="#8458B3" fill-opacity="0.04">
      <animate attributeName="r" values="96;114;96" dur="6s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.03;0.08;0.03" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Hexagonal Security Grid Backplane -->
    <polygon points="0,-102 88,-51 88,51 0,102 -88,51 -88,-51" fill="none" stroke="#8458B3" stroke-opacity="0.14" stroke-width="1" />
    <polygon points="0,-92 80,-46 80,46 0,92 -80,46 -80,-46" fill="none" stroke="#A0D2EB" stroke-opacity="0.09" stroke-width="0.8" stroke-dasharray="4 8" />

    <!-- Circuit Interconnect Lines -->
    <g stroke="#A28089" stroke-width="1.2" stroke-opacity="0.35" fill="none" stroke-linecap="round">
      <path id="path1" d="M -75 -10 L -115 -45 L -165 -45" />
      <path id="path2" d="M -75 25 L -100 52 L -145 52" />
      <path id="path3" d="M -45 -65 L -65 -98 L -115 -98" />
      <path id="path4" d="M 45 65 L 65 98 L 115 98" />
      <path id="path5" d="M 75 -10 L 115 -45 L 165 -45" />
      <path d="M 75 25 L 105 52 L 155 52" />
    </g>

    <!-- Glowing Data Packet Signal Traveling Along Circuit Tracks -->
    <circle r="2" fill="#A0D2EB" filter="url(#softGlow)">
      <animateMotion path="M -75 -10 L -115 -45 L -165 -45" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#8458B3" filter="url(#softGlow)">
      <animateMotion path="M 75 -10 L 115 -45 L 165 -45" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Circuit Node Glowing Dots -->
    <g>
      <circle cx="-165" cy="-45" r="3.5" fill="#A0D2EB" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="-145" cy="52" r="3.5" fill="#8458B3" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="-115" cy="-98" r="3.5" fill="#A0D2EB" filter="url(#softGlow)" />
      <circle cx="115" cy="98" r="3.5" fill="#8458B3" filter="url(#softGlow)" />
      <circle cx="165" cy="-45" r="3.5" fill="#D0BDF4" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="155" cy="52" r="3.5" fill="#A0D2EB" filter="url(#softGlow)" />
    </g>

    <!-- Interactive Animated Tactical Rings -->
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#D0BDF4" stroke-opacity="0.12" stroke-width="1" />
    
    <!-- Primary Clockwise Dashed Tech Orbit -->
    <circle cx="0" cy="0" r="83" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.5" stroke-dasharray="115 35 25 35" stroke-width="1.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite" />
    </circle>
    
    <!-- Counter-Clockwise Inner Code Ring -->
    <circle cx="0" cy="0" r="69" fill="none" stroke="#8458B3" stroke-opacity="0.35" stroke-dasharray="8 12" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="19s" repeatCount="indefinite" />
    </circle>

    <!-- Concentric Radar Ring Sweep -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#A0D2EB" stroke-opacity="0.16" stroke-width="1" />

    <!-- Center Icon: Cybersecurity Glass Shield with AE Monogram -->
    <g filter="url(#neonGlow)">
      <!-- Outer Shield Base & Accent Stroke -->
      <path d="M -26 -30 L 26 -30 L 26 -4 C 26 14 0 30 0 30 C 0 30 -26 14 -26 -4 Z" 
            fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linejoin="round" />
      
      <!-- Inner Shield Border Highlight -->
      <path d="M -20 -24 L 20 -24 L 20 -4 C 20 10 0 23 0 23 C 0 23 -20 10 -20 -4 Z" 
            fill="none" stroke="#8458B3" stroke-opacity="0.48" stroke-width="1" />
    </g>
    
    <!-- Central Monogram Emblem -->
    <text x="0" y="5" font-family="Consolas, Monaco, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#A0D2EB" text-anchor="middle" letter-spacing="0.5">&lt;AE/&gt;</text>
  </g>
</svg>
